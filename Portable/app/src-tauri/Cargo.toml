[package]
name = "cardinal"
version = "0.1.0"
description = "Cardinal : conception de bases de données avec Merise (MCD, MLD, UML, SQL)"
authors = ["Falilou Diouf"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "cardinal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
